[project]
name = "lola-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "email-validator>=2.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "cryptography>=43.0",
    # 1.97: reasoning_effort mapping (Anthropic thinking, Gemini thinkingConfig, Ollama think) and supports_reasoning() verified on this version.
    "litellm>=1.97",
    "httpx>=0.27",
    # Decodes uploaded audio (WebM/Opus etc.) for server STT, see features/ai/stt/audio.py.
    "av>=11",
    # Run the server's Parakeet STT model (features/ai/stt/parakeet_local.py).
    "onnxruntime>=1.17,<2",
    "numpy>=1.24",
    "anyio>=4.0",
    "pyyaml>=6.0",
    # Text normalization for TTS (features/ai/tts/normalizer.py). Capped at the minor version:
    # before 1.0 a minor release may change the spoken output, a patch release never does.
    "normt2s>=0.7.0,<0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
# Without this explicit list, "pip install ." / "pip install -e ." fails: setuptools sees both app/
# and alembic/ as possible top-level packages of a flat layout under backend/ and refuses to
# auto-discover ("Multiple top-level packages discovered in a flat-layout"). alembic/ is left out on
# purpose — it is run via "python -m alembic" from the working directory, not imported as an
# installed package.
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Several tests import helpers via "from tests.conftest import …". "python -m pytest" puts the
# working directory on sys.path, but a bare "pytest" (as in the release workflow) doesn't, so
# those modules failed to import there.
pythonpath = ["."]
