name: Build and Publish Docker Images to GitHub Container Registry

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-push:
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: docker/backend.Dockerfile
          - component: frontend
            dockerfile: docker/frontend.Dockerfile
          # The optional local text-to-speech sidecar (see local-tts/) — a large image (CPU
          # PyTorch), only pulled by deployments that enable the "local-tts" Compose profile.
          - component: local-tts
            dockerfile: docker/local-tts.Dockerfile
          # The optional knowledge (RAG) service (see rag/) — only pulled by deployments that
          # enable the "rag" Compose profile.
          - component: rag
            dockerfile: docker/rag.Dockerfile
          # The optional evaluation (Ragas) service (see rag-eval/) — only pulled by deployments
          # that enable the "rag-eval" Compose profile.
          - component: rag-eval
            dockerfile: docker/rag-eval.Dockerfile
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          TAGS="ghcr.io/c-siegel/lola:${{ matrix.component }}"
          TAGS="$TAGS,ghcr.io/c-siegel/lola:${{ matrix.component }}-${{ github.sha }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,ghcr.io/c-siegel/lola:${{ matrix.component }}-${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Only the frontend Dockerfile declares this ARG; other images ignore it with a warning.
          build-args: |
            APP_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
